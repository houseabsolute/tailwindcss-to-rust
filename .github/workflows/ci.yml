name: Continuous integration

on: [push, pull_request]

env:
  CRATE_NAME: tailwindcss-to-rust
  GITHUB_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1

jobs:
  test-matrix:
    name: ${{ matrix.platform.os-name }} with rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # The integration test shells out to `cargo` and `tailwindcss` on the
          # host, but cross-compiling to aarch64 runs the test suite inside a
          # `cross` Docker container, where neither is available. So we only
          # build for this target.
          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            skip-tests: true
          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
          - os-name: macOS-aarch64
            runs-on: macOS-latest
            target: aarch64-apple-darwin
        toolchain:
          - stable
        include:
          - platform:
              os-name: Linux-x86_64
              runs-on: ubuntu-24.04
              target: x86_64-unknown-linux-musl
            toolchain: beta
          - platform:
              os-name: Linux-x86_64
              runs-on: ubuntu-24.04
              target: x86_64-unknown-linux-musl
            toolchain: nightly
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Run tests
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: "test"
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args: "--locked --release"
        if: ${{ !matrix.platform.skip-tests }}
      # `cargo test` doesn't build the tailwindcss-to-rust binary, because the
      # tests for it live in a separate package, so we have to build it
      # explicitly for the release step to package.
      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: "build"
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args: "--locked --release"
        if: matrix.toolchain == 'stable'
      - name: Publish artifacts and release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: tailwindcss-to-rust
          changes-file: generator/Changes.md
          target: ${{ matrix.platform.target }}
          action-gh-release-parameters: '{ "make_latest": false }'
        if: matrix.toolchain == 'stable'
