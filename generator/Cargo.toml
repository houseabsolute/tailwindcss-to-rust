[package]
name = "tailwindcss-to-rust"
version = "0.3.2"
authors = ["Dave Rolsky <autarch@urth.org>"]
description = "Generate Rust code from your compiled tailwind CSS"
repository = "https://github.com/houseabsolute/tailwindcss-to-rust"
readme = "README.md"
license = "Apache-2.0 OR MIT"
edition = "2021"

[dependencies]
clap = { version = "3", features = ["derive"] }
itertools = "0.14.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
tinytemplate = "1.2.1"

[features]
